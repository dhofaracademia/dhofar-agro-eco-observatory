name: Regional vegetation refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regions.yml'
      - 'satellite/pipeline/refresh_regions.py'
      - 'app/public/data/regions/boundaries.geojson'
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * *'
permissions:
  contents: write
concurrency:
  group: satellite-readings-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: satellite/pipeline/requirements.txt
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: pip install -r satellite/pipeline/requirements.txt
      - run: python satellite/pipeline/tests/test_regions.py
      - name: Refresh complete regional document
        id: refresh
        continue-on-error: true
        run: python satellite/pipeline/refresh_regions.py
      - name: Publish observations or failure status
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/regions
          if ! git diff --cached --quiet; then
            git commit -m 'data: regional vegetation observations and refresh status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Surface failure while retaining previous observations
        if: steps.refresh.outcome == 'failure'
        run: exit 1
