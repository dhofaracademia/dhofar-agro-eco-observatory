name: Observatory quality
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['app/public/data/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: satellite/pipeline/requirements.txt
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: pip install -r satellite/pipeline/requirements.txt
      - run: python satellite/pipeline/tests/run_all.py
      - run: python -m unittest discover -s validation -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: node --test tests/satellite-scenes.test.cjs
      - run: node --experimental-strip-types --test tests/site-insights.test.mjs tests/data-quality.test.mjs
      - run: npm ci && npm run build
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npx playwright test
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: app/test-results
