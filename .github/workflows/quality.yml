name: Observatory quality
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['app/public/data/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: satellite/pipeline/requirements.txt
      - run: pip install -r satellite/pipeline/requirements.txt
      - run: python satellite/pipeline/tests/run_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
