name: Observatory quality
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['app/public/data/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: satellite/pipeline/requirements.txt
      - run: pip install -r satellite/pipeline/requirements.txt
      - run: python satellite/pipeline/tests/run_all.py
      - run: python -m unittest discover -s validation -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: node --test tests/satellite-scenes.test.cjs
      - run: node --experimental-strip-types --test tests/site-insights.test.mjs tests/data-quality.test.mjs
      - run: npm ci && npm run build
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npx playwright test
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: app/test-results
